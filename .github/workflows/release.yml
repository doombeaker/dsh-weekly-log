name: release

# Publishes to npm when a v<version> tag is pushed.
# Trusted publishing (OIDC): no NPM_TOKEN secret, no OTP. Configure the
# publisher once at https://www.npmjs.com/package/dsh-weekly-log/access
# -> Trusted publishing -> GitHub: doombeaker/dsh-weekly-log, workflow release.yml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm CLI; do not rely on the bundled one.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Check sources
        run: npm run check

      - name: Publish
        run: npm publish --access public
